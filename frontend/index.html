<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argument Map — платформа для исламских исследований</title>
    <!--
      Шрифты: self-hosted через @fontsource-variable (импорт в
      src/index.css). Google Fonts CDN убран в Сессии 38 - причина:
      убрать FOUT при reload (DNS lookup + 2 round-trips fonts.gstatic.com
      → CSS → WOFF2 давали flash системными fallback'ами на 100-300ms).
      Теперь Vite инжектит шрифты как hashed assets с
      <link rel="modulepreload">, грузятся параллельно с bundle.
    -->
    <!--
      FOUC prevention для dark theme - применяем data-theme до React mount.
      Иначе на первой отрисовке страница flash'ит в light theme, потом
      ThemeEffect.tsx в useEffect перекидывает на dark - заметный мерцающий
      переход. Inline script читает localStorage и prefers-color-scheme в том
      же порядке что и themeStore.ts (single source of truth должна совпадать).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app.theme');
          // Совместимо с 3-option mode (system/light/dark). null = no
          // saved preference, default `system`. Single source of truth с
          // themeStore.ts - если меняешь логику, синхронизируй обе стороны.
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark =
            saved === 'dark' ||
            ((saved === 'system' || saved == null) && systemDark);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* localStorage может быть отключен - тогда default theme = light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
