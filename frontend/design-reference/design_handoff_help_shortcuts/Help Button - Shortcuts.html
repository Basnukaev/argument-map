<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Help Button — Shortcuts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --font: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  .theme-dark {
    --bg: #0d0d0a;
    --surface: #1a1a16;
    --surface-2: #22221d;
    --border: #2a2a23;
    --border-strong: #3a3a31;
    --text: #ece8df;
    --text-muted: #8a8678;
    --text-dim: #5a5750;
    --accent-fg: oklch(0.82 0.14 295);
    --grid-dot: rgba(255,255,255,.045);
    --shadow-card: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.4);
    --shadow-float: 0 2px 0 rgba(255,255,255,.03), 0 16px 40px rgba(0,0,0,.55);
  }
  .theme-light {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --surface-2: #f1efe7;
    --border: #e4e1d6;
    --border-strong: #cfcbbb;
    --text: #1c1b16;
    --text-muted: #6f6c5e;
    --text-dim: #a09c8c;
    --accent-fg: oklch(0.45 0.2 295);
    --grid-dot: rgba(0,0,0,.06);
    --shadow-card: 0 1px 2px rgba(20,18,10,.06), 0 8px 24px rgba(20,18,10,.08);
    --shadow-float: 0 2px 4px rgba(20,18,10,.06), 0 16px 40px rgba(20,18,10,.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font); background: #0a0a08; color: #ece8df; }

  /* ── Demo shell ── */
  .demo-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: rgba(10,10,8,.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: 13px;
  }
  .demo-bar .title { font-weight: 600; color: #fff; margin-right: auto; letter-spacing: -.01em; }
  .demo-bar .title small { color: #8a8678; font-weight: 400; margin-left: 8px; }
  .demo-bar .group { display: flex; align-items: center; gap: 2px; padding: 3px; background: rgba(255,255,255,.04); border-radius: 9px; }
  .demo-bar .group button {
    border: 0; background: transparent; color: #b8b3a3; cursor: pointer;
    font: 500 12.5px/1 var(--font); padding: 7px 12px; border-radius: 7px;
  }
  .demo-bar .group button[data-active=true] { background: rgba(255,255,255,.1); color: #fff; }
  .demo-bar .label { color: #6e6a5d; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }

  .stage {
    position: fixed; inset: 52px 0 0 0;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 36px 36px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }

  /* ── The component itself ── */
  .help-btn {
    position: relative;
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 9px;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-card);
    transition: color .15s, border-color .15s, transform .15s;
  }
  .help-btn:hover, .help-btn[data-open="true"] {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .help-btn:active { transform: scale(0.96); }

  .help-pop {
    position: absolute;
    top: calc(100% + 10px); right: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow-float);
    min-width: 260px;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  .help-btn:hover .help-pop,
  .help-btn[data-open="true"] .help-pop,
  .help-pop:hover {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .help-pop .pop-title {
    font: 500 11px/1 var(--font);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .help-pop .pop-title .pin-toggle {
    color: var(--text-dim); cursor: pointer; opacity: 0;
    transition: opacity .15s, color .15s;
    background: none; border: 0; padding: 2px;
    display: inline-flex;
  }
  .help-pop:hover .pin-toggle { opacity: 1; }
  .help-pop .pin-toggle:hover { color: var(--accent-fg); }

  .help-pop .group-label {
    font: 500 10.5px/1 var(--mono);
    color: var(--text-dim);
    padding: 8px 6px 4px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .help-pop .group-label:first-of-type { padding-top: 0; }

  .help-pop .row {
    display: flex; align-items: center;
    gap: 12px;
    padding: 7px 6px;
    border-radius: 6px;
    font: 400 13px/1 var(--font);
    color: var(--text);
  }
  .help-pop .row:hover { background: var(--surface-2); }
  .help-pop .row span:first-child { flex: 1; color: var(--text); }
  .help-pop .kbds { display: inline-flex; gap: 3px; }
  .help-pop .kbd {
    font: 500 11px/1 var(--mono);
    background: var(--surface-2);
    color: var(--text);
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    min-width: 18px;
    text-align: center;
  }

  /* Anchored demo — show the button in different positions */
  .anchor-tl, .anchor-tr, .anchor-bl, .anchor-br, .anchor-center {
    position: absolute;
  }
  .anchor-tr { top: 24px; right: 24px; }
  .anchor-tl { top: 24px; left: 24px; }
  .anchor-br { bottom: 24px; right: 24px; }
  .anchor-bl { bottom: 24px; left: 24px; }
  .anchor-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

  /* Variant: pop opens upward */
  .help-pop.up {
    top: auto;
    bottom: calc(100% + 10px);
    transform: translateY(4px);
  }
  .help-btn:hover .help-pop.up,
  .help-btn[data-open="true"] .help-pop.up {
    transform: translateY(0);
  }

  /* Variant: pop opens to the left */
  .help-pop.left { right: auto; left: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

/* ── Tiny SVG icon ── */
const HelpIcon = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10" />
    <path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4" />
    <circle cx="12" cy="17" r=".5" fill="currentColor" />
  </svg>
);

const PinIcon = ({ size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 17v5" />
    <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
  </svg>
);

/* ─────────────────────────────────────────────
   HelpShortcuts — drop-in component

   Props:
     shortcuts:   array of { group?, label, keys: string[] }
                  consecutive items sharing a `group` are clustered under one label
     position:    'down' (default) | 'up'  — pop direction
     align:       'right' (default) | 'left' — pop horizontal alignment
     title:       header label (default: 'Шорткаты')
     icon:        replace the trigger icon
     trigger:     'hover' (default) | 'click'
   ───────────────────────────────────────────── */
function HelpShortcuts({
  shortcuts,
  position = 'down',
  align = 'right',
  title = 'Шорткаты',
  icon,
  trigger = 'hover',
}) {
  const [open, setOpen] = useState(false);
  const [pinned, setPinned] = useState(false);

  // Group consecutive items by their `group` key
  const groups = [];
  let current = null;
  for (const sc of shortcuts) {
    if (!current || current.name !== (sc.group || null)) {
      current = { name: sc.group || null, items: [] };
      groups.push(current);
    }
    current.items.push(sc);
  }

  const isOpen = pinned || open || (trigger === 'click' ? open : false);

  const handleClick = () => {
    if (trigger === 'click') setOpen(o => !o);
  };

  return (
    <div
      className="help-btn"
      data-open={isOpen}
      role="button"
      tabIndex={0}
      onMouseEnter={() => trigger === 'hover' && setOpen(true)}
      onMouseLeave={() => trigger === 'hover' && !pinned && setOpen(false)}
      onClick={handleClick}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleClick(); } }}
      aria-label={title}
    >
      {icon || <HelpIcon size={16} />}
      <div className={`help-pop ${position === 'up' ? 'up' : ''} ${align === 'left' ? 'left' : ''}`}>
        <div className="pop-title">
          <span>{title}</span>
          <button
            className="pin-toggle"
            onClick={(e) => { e.stopPropagation(); setPinned(p => !p); }}
            title={pinned ? 'Открепить' : 'Закрепить'}
            style={{ color: pinned ? 'var(--accent-fg)' : undefined, opacity: pinned ? 1 : undefined }}
          >
            <PinIcon size={12} />
          </button>
        </div>

        {groups.map((g, gi) => (
          <React.Fragment key={gi}>
            {g.name && <div className="group-label">{g.name}</div>}
            {g.items.map((it, i) => (
              <div className="row" key={i}>
                <span>{it.label}</span>
                <span className="kbds">
                  {it.keys.map((k, ki) => <span className="kbd" key={ki}>{k}</span>)}
                </span>
              </div>
            ))}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ── Sample shortcuts for the demo ── */
const SHORTCUTS = [
  { group: 'Навигация',  label: 'Детали узла',       keys: ['2×'] },
  { group: 'Навигация',  label: 'Контекстное меню',  keys: ['RMB'] },
  { group: 'Навигация',  label: 'Сбросить вид',      keys: ['0'] },

  { group: 'Действия',   label: 'Добавить узел',     keys: ['N'] },
  { group: 'Действия',   label: 'Создать связь',     keys: ['L'] },
  { group: 'Действия',   label: 'Удалить',           keys: ['Del'] },

  { group: 'Выделение',  label: 'Выделить всё',      keys: ['⌘', 'A'] },
  { group: 'Выделение',  label: 'Снять выделение',   keys: ['Esc'] },
];

/* ── Demo app ── */
function App() {
  const [theme, setTheme] = useState('dark');
  const [position, setPosition] = useState('down');
  const [trigger, setTrigger] = useState('hover');

  return (
    <>
      <div className="demo-bar">
        <div className="title">Help Button — Shortcuts <small>отдельный компонент</small></div>

        <span className="label">Тема</span>
        <div className="group">
          <button data-active={theme === 'dark'} onClick={() => setTheme('dark')}>Тёмная</button>
          <button data-active={theme === 'light'} onClick={() => setTheme('light')}>Светлая</button>
        </div>

        <span className="label">Открытие</span>
        <div className="group">
          <button data-active={trigger === 'hover'} onClick={() => setTrigger('hover')}>Hover</button>
          <button data-active={trigger === 'click'} onClick={() => setTrigger('click')}>Click</button>
        </div>

        <span className="label">Направление</span>
        <div className="group">
          <button data-active={position === 'down'} onClick={() => setPosition('down')}>Вниз</button>
          <button data-active={position === 'up'} onClick={() => setPosition('up')}>Вверх</button>
        </div>
      </div>

      <div className={`stage theme-${theme}`}>
        {/* Centered showcase — auto-opens on hover */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, color: 'var(--text-muted)', font: '13px/1.5 var(--font)' }}>
          <div style={{ textAlign: 'center', maxWidth: 360 }}>
            <div style={{ color: 'var(--text)', fontSize: 16, fontWeight: 600, marginBottom: 6 }}>
              Наведи курсор на «?»
            </div>
            Кликни на иконку «булавки» в шапке поповера, чтобы закрепить его открытым.
          </div>

          <HelpShortcuts
            shortcuts={SHORTCUTS}
            position={position}
            align="right"
            trigger={trigger}
          />
        </div>

        {/* Corner anchors — show how it behaves in real positions */}
        <div className="anchor-tr">
          <HelpShortcuts shortcuts={SHORTCUTS} position="down" align="right" trigger={trigger} />
        </div>
        <div className="anchor-tl">
          <HelpShortcuts shortcuts={SHORTCUTS} position="down" align="left" trigger={trigger} />
        </div>
        <div className="anchor-br">
          <HelpShortcuts shortcuts={SHORTCUTS} position="up" align="right" trigger={trigger} />
        </div>
        <div className="anchor-bl">
          <HelpShortcuts shortcuts={SHORTCUTS} position="up" align="left" trigger={trigger} />
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
