<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Argument Map — Redesign Spec</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">

<style>
  /* Page chrome */
  body { background: #efeae3; }
  .page-intro {
    max-width: 820px; margin: 32px auto 16px; padding: 0 24px;
    font-family: var(--font-ui);
  }
  .page-intro h1 { font-size: 32px; margin: 0 0 8px; color: #1a1a1a; }
  .page-intro p  { color: #555; margin: 0; line-height: 1.5; }

  /* Generic artboard interior */
  .ab {
    width: 100%; height: 100%;
    background: var(--bg-app);
    color: var(--text-base);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* === FOUNDATIONS artboard === */
  .found-grid { padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .found-section h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 0 0 16px; font-weight: 600; }
  .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 12px; }
  .swatch { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .swatch__color { height: 56px; }
  .swatch__meta { padding: 8px 10px; background: var(--bg-card); font-size: 12px; }
  .swatch__name { font-weight: 600; color: var(--text-strong); }
  .swatch__val { font-family: var(--font-mono); color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .type-row { padding: 12px 0; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: baseline; gap: 16px; }
  .type-row:last-child { border-bottom: none; }
  .type-row__label { width: 80px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .button-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  /* Topics list */
  .topics-page { padding: 32px 40px; }
  .topics-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
  .topics-filters { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  .search-input {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px;
    background: var(--bg-card); border: 1px solid var(--border-base); border-radius: 8px;
    flex: 1; max-width: 380px;
  }
  .search-input input { background: none; border: none; outline: none; font-family: inherit; font-size: 13px; flex: 1; color: var(--text-strong); }
  .search-input input::placeholder { color: var(--text-faint); }
  .search-icon { color: var(--text-muted); }

  .topics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .topic-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 200ms var(--ease), transform 200ms var(--ease);
    display: flex; flex-direction: column;
  }
  .topic-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .topic-card__thumb {
    height: 130px; background: var(--bg-subtle);
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .topic-card__stats {
    position: absolute; top: 10px; right: 10px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    font-size: 11px; color: var(--text-meta);
    font-family: var(--font-mono);
  }
  .topic-card__body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .topic-card__title { font-size: 15px; font-weight: 600; color: var(--text-strong); display: flex; align-items: center; gap: 6px; }
  .topic-card__desc { font-size: 13px; color: var(--text-muted); line-height: 1.45; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .topic-card__foot { padding: 10px 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-meta); }
  .topic-card__vis { display: inline-flex; align-items: center; gap: 4px; }
  .topic-card svg { color: currentColor; }

  /* === GRAPH artboard === */
  .graph-shell { display: grid; grid-template-rows: 56px 56px 1fr; height: 100%; }
  .graph-sub {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: var(--bg-card); border-bottom: 1px solid var(--border-subtle);
    height: 56px;
  }
  .graph-sub__path { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .graph-sub__path strong { color: var(--text-strong); font-weight: 600; }
  .graph-sub__path span { color: var(--text-muted); }
  .graph-body { position: relative; background: var(--bg-canvas); overflow: hidden; }
  .graph-toolbar {
    position: absolute; top: 16px; left: 16px;
    display: flex; flex-direction: column; gap: 4px;
    padding: 4px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
    box-shadow: var(--shadow-md);
    z-index: 2;
  }
  .graph-toolbar .icon-btn { width: 36px; height: 36px; position: relative; }
  .graph-toolbar .icon-btn:hover::after {
    content: attr(data-tooltip);
    position: absolute; left: 46px; top: 50%; transform: translateY(-50%);
    background: var(--text-strong); color: var(--bg-card);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap;
    pointer-events: none;
  }
  .graph-toolbar__sep { height: 1px; background: var(--border-subtle); margin: 4px 0; }

  .graph-help {
    position: absolute; top: 16px; right: 16px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 8px 12px; display: flex; gap: 16px;
    font-size: 12px; color: var(--text-muted);
    box-shadow: var(--shadow-sm); z-index: 2;
  }
  .graph-help__item { display: inline-flex; align-items: center; gap: 6px; }

  .graph-zoom {
    position: absolute; top: 72px; right: 16px;
    display: flex; gap: 4px;
    z-index: 2;
  }
  .graph-zoom .icon-btn {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-sm);
  }

  .graph-minimap {
    position: absolute; bottom: 16px; right: 16px;
    width: 220px; height: 140px;
    background: var(--bg-card);
    border: 1px solid var(--border-base);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    z-index: 2;
  }
  .graph-minimap__viewport {
    position: absolute; border: 2px dashed var(--brand-500);
    border-radius: 4px;
    pointer-events: none;
  }

  /* Graph nodes */
  .node {
    position: absolute;
    background: var(--bg-card);
    border: 1px solid var(--border-base);
    border-radius: 10px;
    padding: 10px 12px;
    width: 200px;
    box-shadow: var(--shadow-sm);
    font-size: 13px;
    line-height: 1.4;
  }
  .node--selected { border-color: var(--brand-500); box-shadow: 0 0 0 3px oklch(52% 0.20 270 / 0.18), var(--shadow-md); }
  .node__head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .node__body { color: var(--text-base); }
  .node__foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-subtle);
    font-size: 11px;
    color: var(--text-meta);
  }
  .node__vote { display: inline-flex; align-items: center; gap: 4px; }
  .node__vote-btn {
    background: none; border: none; cursor: pointer;
    padding: 2px; color: var(--text-muted);
    border-radius: 4px;
  }
  .node__vote-btn:hover { background: var(--bg-hover); color: var(--text-base); }

  .node--question  { background: var(--node-question); border-color: var(--node-question-bd); }
  .node--question .pill--question { background: oklch(100% 0 0 / 0.6); }
  [data-theme="dark"] .node--question .pill--question { background: oklch(0% 0 0 / 0.3); }
  .node--thesis    { background: var(--node-thesis);   border-color: var(--node-thesis-bd); }
  .node--argument  { background: var(--node-argument); border-color: var(--node-argument-bd); }
  .node--evidence  { background: var(--node-evidence); border-color: var(--node-evidence-bd); }

  /* edges (svg) */
  .edge-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .edge { fill: none; stroke-width: 1.5; }
  .edge--supports  { stroke: var(--edge-supports); }
  .edge--attacks   { stroke: var(--edge-attacks); }
  .edge--rebuts    { stroke: var(--edge-rebuts); stroke-dasharray: 6 4; }
  .edge--clarifies { stroke: var(--edge-clarifies); }

  /* Right detail panel */
  .detail-rail {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 360px;
    background: var(--bg-card);
    border-left: 1px solid var(--border-base);
    z-index: 3;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  .detail-head { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
  .detail-head__top { display: flex; align-items: center; justify-content: space-between; }
  .detail-head__title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .detail-head__meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .detail-section { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
  .detail-section__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .detail-section__title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .detail-section__count { background: var(--bg-subtle); color: var(--text-meta); padding: 1px 6px; border-radius: 999px; font-size: 11px; }
  .detail-meta-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .detail-meta-row__k { color: var(--text-muted); }
  .detail-meta-row__v { color: var(--text-strong); font-family: var(--font-mono); font-size: 12px; }

  .selection-bar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    padding: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border-base);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    z-index: 4;
  }
  .selection-bar__label {
    padding: 0 12px; height: 32px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-base);
  }
  .selection-bar__sep { width: 1px; align-self: stretch; background: var(--border-subtle); margin: 4px 4px; }

  /* === READER === */
  .reader-shell { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .reader-toc { background: var(--bg-card); border-right: 1px solid var(--border-subtle); padding: 20px 16px; overflow-y: auto; }
  .reader-toc__title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .reader-toc__item { padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--text-base); cursor: pointer; }
  .reader-toc__item:hover { background: var(--bg-hover); }
  .reader-toc__item--active { background: var(--brand-100); color: var(--brand-700); font-weight: 600; }
  [data-theme="dark"] .reader-toc__item--active { background: var(--brand-800); color: var(--brand-100); }

  .reader-main { padding: 24px 40px; overflow-y: auto; max-height: 100%; }
  .reader-head {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .reader-controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .page-input { display: inline-flex; align-items: center; gap: 8px; }
  .page-input input { width: 60px; }

  .reader-body { font-family: var(--font-ar); font-size: 22px; line-height: 1.85; direction: rtl; text-align: right; color: var(--text-strong); max-width: 800px; margin: 0 auto; }
  .reader-body h2 { font-weight: 700; margin: 24px 0 12px; font-size: 26px; }

  /* === Q&A === */
  .qa-page { padding: 32px 40px; max-width: 920px; margin: 0 auto; }
  .qa-item { display: flex; gap: 16px; padding: 16px 20px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-card); margin-bottom: 12px; align-items: center; cursor: pointer; transition: border-color var(--duration-fast) var(--ease); }
  .qa-item:hover { border-color: var(--border-base); }
  .qa-item__main { flex: 1; }
  .qa-item__title { font-size: 16px; font-weight: 600; color: var(--text-strong); margin-bottom: 4px; }
  .qa-item__desc { font-size: 13px; color: var(--text-muted); }
  .qa-item__foot { font-size: 12px; color: var(--text-meta); margin-top: 8px; display: flex; gap: 12px; align-items: center; }

  /* === HADITH === */
  .isnad-link {
    display: grid; grid-template-columns: 24px 1fr 100px;
    align-items: center;
    padding: 8px 12px; border-radius: 6px;
    font-size: 13px;
    transition: background var(--duration-fast) var(--ease);
    cursor: pointer;
  }
  .isnad-link:hover { background: var(--bg-hover); }
  .isnad-link__idx { font-family: var(--font-mono); color: var(--text-meta); font-size: 12px; }
  .isnad-link__name { font-family: var(--font-ar); font-size: 18px; }
  .isnad-link__hash { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); text-align: right; }
  .isnad-link:hover .isnad-link__hash { color: var(--text-meta); }

  /* === SETTINGS === */
  .settings-page { padding: 32px 40px; max-width: 960px; margin: 0 auto; }
  .settings-section { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .settings-row { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--border-subtle); align-items: center; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row__title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .settings-row__hint { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Slider */
  .slider { position: relative; width: 240px; height: 24px; display: flex; align-items: center; }
  .slider__track { width: 100%; height: 4px; background: var(--bg-subtle); border-radius: 2px; overflow: hidden; }
  .slider__fill { height: 100%; background: var(--brand-500); border-radius: 2px; }
  .slider__thumb { position: absolute; width: 16px; height: 16px; background: var(--bg-card); border: 2px solid var(--brand-500); border-radius: 50%; box-shadow: var(--shadow-sm); }
  .slider__val { font-family: var(--font-mono); font-size: 12px; color: var(--text-meta); margin-left: 12px; min-width: 30px; }

  /* === ADMIN === */
  .admin-page { padding: 32px 40px; }
  .admin-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color var(--duration-fast) var(--ease); }
  .stat-card:hover { border-color: var(--border-base); }
  .stat-card__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .stat-card__value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--text-strong); }
  .stat-card__sub { font-size: 11px; color: var(--text-meta); margin-top: 4px; }

  .log-line { display: grid; grid-template-columns: 80px 50px 1fr; gap: 12px; padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; align-items: center; border-bottom: 1px solid var(--border-subtle); }
  .log-line:last-child { border-bottom: none; }
  .log-line__time { color: var(--text-meta); }
  .log-line__msg { color: var(--text-base); }
  .log-line__lvl { font-weight: 600; padding: 2px 6px; border-radius: 4px; text-align: center; font-size: 11px; }

  /* === STATES === */
  .state-illus { width: 96px; height: 96px; margin: 0 auto 20px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; background: var(--bg-subtle); border-radius: 50%; }
  .state-block { text-align: center; padding: 80px 24px; max-width: 460px; margin: 0 auto; }
  .state-block__title { font-size: 22px; font-weight: 700; color: var(--text-strong); margin: 0 0 8px; }
  .state-block__body { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0 0 24px; }
  .state-block__actions { display: inline-flex; gap: 12px; }

  /* skeleton */
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .sk {
    background: linear-gradient(90deg,
      var(--bg-subtle) 0%,
      var(--bg-hover) 50%,
      var(--bg-subtle) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 6px;
  }
  .sk-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; }
  .sk-line { height: 12px; margin: 8px 0; }

  /* === MOBILE === */
  .mob-frame { width: 390px; height: 720px; margin: 0 auto; background: var(--bg-app); border-radius: 28px; overflow: hidden; position: relative; box-shadow: 0 0 0 8px #2a2a2a, 0 0 0 9px #444; }
  .mob-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border-subtle); }
  .mob-title { padding: 20px 20px 12px; }
  .mob-title h1 { font-size: 24px; font-weight: 700; color: var(--text-strong); margin: 0 0 4px; }
  .mob-title p { font-size: 13px; color: var(--text-muted); margin: 0; }
  .mob-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

  /* misc */
  svg { display: block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="page-intro">
  <h1>Argument Map — Redesign</h1>
  <p>Полная пересборка всех экранов с фиксами найденных проблем: токены, dark-контраст, mobile hit-targets, custom dropdowns, loading/empty/error states, RTL-mirror, иерархия. Каждый ARTBOARD self-contained — кликните «Focus» в правом верхнем углу, чтобы открыть на полный экран.</p>
</div>
