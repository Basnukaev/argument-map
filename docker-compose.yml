services:
  postgres:
    image: postgres:16-alpine
    container_name: argumentmap-postgres
    environment:
      POSTGRES_DB: argumentmap
      POSTGRES_USER: argmap
      POSTGRES_PASSWORD: argmap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argmap -d argumentmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage (ADR-024). MinIO как dev-backend для S3-compatible API.
  # Версия pin'нута явно - latest tag меняется и может ломать setup.
  # cpuv1 вариант не использует AVX2 (нужно для старых VM / WSL2 хостов).
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: argumentmap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001, login minioadmin/minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot контейнер: создаёт 4 bucket'а (ADR-024) и включает versioning
  # на critical/imported (forever retention). derived-artifacts без versioning -
  # re-derivable, не нужно платить за version history.
  # Запускается каждый docker compose up, но команды idempotent через
  # `mc mb --ignore-existing` и `mc version enable` (no-op если уже включено).
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: argumentmap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/library-imported-books local/library-user-uploads local/library-page-images local/derived-artifacts &&
      mc version enable local/library-imported-books &&
      mc version enable local/library-user-uploads &&
      mc version enable local/library-page-images &&
      echo 'buckets ready: library-imported-books, library-user-uploads, library-page-images, derived-artifacts'
      "

volumes:
  postgres-data:
  minio-data:
