services:
  postgres:
    image: postgres:16-alpine
    container_name: argumentmap-postgres
    environment:
      POSTGRES_DB: argumentmap
      POSTGRES_USER: argmap
      POSTGRES_PASSWORD: argmap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argmap -d argumentmap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
