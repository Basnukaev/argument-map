server:
  port: 9090

spring:
  profiles:
    default: local
  application:
    name: argument-map

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # File upload limits (Этап 16.b). 50MB достаточно для большинства
  # арабских PDF книг (тафсиры и сборники хадисов обычно 10-30MB).
  # Превышение -> 413 Payload Too Large через GlobalExceptionHandler.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Actuator security (ADR-048, Security backlog Crit #7). В prod profile
# /actuator/** (кроме health/info) требует basic auth - reconnaissance
# defence. В dev/test/local - actuator открыт, эти env остаются пустыми.
# В prod обязательны через env ACTUATOR_USERNAME / ACTUATOR_PASSWORD -
# ActuatorSecurityConfig падает с IllegalStateException при старте если
# в prod profile значения пусты.
actuator:
  security:
    username: ${ACTUATOR_USERNAME:}
    password: ${ACTUATOR_PASSWORD:}

# Auth (ADR-040). JWT HS256, access короткоживущий + refresh длинноживущий.
# В prod секрет ОБЯЗАТЕЛЬНО через env AUTH_JWT_SECRET (минимум 256 бит).
# Default placeholder заведомо длиннее 32 ASCII-байт - не использовать в проде.
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-do-not-use-in-prod-at-least-256-bits-required-for-hs256-min-32-chars}
    access-token-ttl-minutes: ${AUTH_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${AUTH_REFRESH_TTL_DAYS:7}
  # Rate limit для auth endpoints (ADR-046, Security backlog Crit #1).
  # Sliding-window 1 минута per IP, lockout при превышении. По умолчанию
  # выключен - dev / test / local нормально работают без настройки. В
  # prod включается через AUTH_RATE_LIMIT_ENABLED=true. Whitelist
  # localhost для CI/smoke.
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:false}
    # login дороже (bcrypt ~100ms) но всё ещё brute-force-able
    login-attempts-per-minute: ${AUTH_RATE_LIMIT_LOGIN:5}
    # register создаёт row в users - агрессивнее лимит против spam
    register-attempts-per-minute: ${AUTH_RATE_LIMIT_REGISTER:3}
    # OWASP baseline для brute-force advisory
    lockout-duration: ${AUTH_RATE_LIMIT_LOCKOUT:PT15M}
    whitelisted-ips:
      - 127.0.0.1
      - "::1"

app:
  cors:
    # Список разрешённых origin'ов через запятую. По умолчанию пусто
    # (никакие cross-origin запросы не разрешены). Переопределяется по профилям.
    allowed-origins: ""

# Object storage (ADR-024). S3-compatible blob storage для PDF/EPUB/scans/
# derived. Поддерживает любой S3-сервис (MinIO/R2/B2/Yandex/AWS S3) -
# дефолты под MinIO в docker-compose. В проде переопределяется через
# environment variables: STORAGE_ENDPOINT/STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY.
storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  # Region обязателен для AWS SDK v2 даже для MinIO (валидируется при build).
  # us-east-1 - стандартный default для S3-compatible.
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  # forcePathStyle обязателен для MinIO (path-style url:
  # http://host/bucket/key вместо virtual-hosted-style http://bucket.host/key).
  # AWS S3 в проде поддерживает оба - этот флаг безопасен везде.
  path-style-access: ${STORAGE_PATH_STYLE:true}
  # Таймауты сетевых операций (Spring Boot Duration: "5s", "30s", "1m").
  # Чтение крупных PDF (Range streaming) - отдельные запросы по chunk,
  # каждый ~1MB - 30с с запасом.
  connect-timeout: 5s
  read-timeout: 30s
  # Максимум retry на transient errors (5xx, throttling, connection reset).
  # AWS SDK v2 встроенный exponential backoff.
  max-retries: 3
  # 4 bucket'а по criticality (ADR-024). Имена переопределяются через env -
  # позволяет dev/staging/prod держать разные namespaces в одном S3 account.
  buckets:
    imported-books: ${STORAGE_BUCKET_IMPORTED:library-imported-books}
    user-uploads: ${STORAGE_BUCKET_UPLOADS:library-user-uploads}
    page-images: ${STORAGE_BUCKET_PAGES:library-page-images}
    derived: ${STORAGE_BUCKET_DERIVED:derived-artifacts}
  # Bucket bootstrap (Этап 16.c). При старте приложения создаёт 4 bucket'а
  # (idempotent через HeadBucket) и включает versioning для 3 critical.
  # По умолчанию off - IT создают buckets сами через @BeforeEach. В dev
  # удобно включить чтобы docker-compose first-run не требовал ручного
  # `mc mb local/library-user-uploads`.
  bucket-bootstrap:
    enabled: ${STORAGE_BUCKET_BOOTSTRAP_ENABLED:false}
  # Orphan-detection janitor (ADR-024, Этап 25.b). Cron job сверяет
  # S3 listObjects vs library_files catalog и наоборот. Log-only -
  # никаких автоудалений, manual review через логи. По умолчанию
  # выключен (избегаем случайных scan'ов в dev/test).
  janitor:
    enabled: ${STORAGE_JANITOR_ENABLED:false}
    # 03:00 ежедневно - после ночных backup'ов, до user-traffic peak
    cron: ${STORAGE_JANITOR_CRON:0 0 3 * * *}
  # Integrity verification cron (ADR-024, Этап 25.b 6-й пункт). Weekly
  # Sunday streaming SHA-256 verification всех library_files vs реальные
  # S3 objects - детектирует bit-rot/silent corruption. Log-only (manual
  # review через grep логов). По умолчанию выключен (full body read всей
  # library тяжёлый, не нужен в dev/test).
  integrity:
    enabled: ${STORAGE_INTEGRITY_ENABLED:false}
    # Воскресенье 04:00 - после backup'ов, минимальная нагрузка.
    # Weekly cadence потому что sweep всех blob'ов тяжелее daily orphan-list
    cron: ${STORAGE_INTEGRITY_CRON:0 0 4 * * SUN}
    # Пауза между files в ms - throttle S3 endpoint при крупной library.
    # 0 для тестов / маленьких объёмов. 100ms = ~10 files/sec cap
    delay-millis: ${STORAGE_INTEGRITY_DELAY_MILLIS:100}

# Refresh token cleanup (ADR-047 follow-up). RefreshTokenCleanupJanitor
# периодически удаляет refresh-записи старше N дней: revoked токены и
# expired never-used. Mandatory до prod - без cleanup'а refresh_tokens
# растёт линейно от login activity. По умолчанию выключен (dev/test/
# staging не требуют). В prod включается через
# REFRESH_TOKEN_CLEANUP_ENABLED=true.
refresh-token:
  cleanup:
    enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:false}
    # 30 дней - balance между forensics window для stolen detection
    # (refresh TTL 7 дней + 3x запас = 30) и табличной hygiene.
    # Минимум 7 (валидация в RefreshTokenCleanupProperties)
    retention-days: ${REFRESH_TOKEN_CLEANUP_RETENTION_DAYS:30}
    # 02:30 ежедневно - после AuditLogRetentionJanitor (02:00) и до
    # orphan janitor (03:00). Stagger чтобы не competition за DB
    cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 30 2 * * *}

# Audit log retention (Code review round 3 #5). AuditLogRetentionJanitor
# периодически удаляет audit_log записи старше N дней. Compliance retention -
# по умолчанию выключен (на dev/test/staging не нужен, audit log там
# некритичен). В prod включается через AUDIT_RETENTION_ENABLED=true.
# Минимум retentionDays = 7 (валидация в AuditRetentionProperties).
audit:
  retention:
    enabled: ${AUDIT_RETENTION_ENABLED:false}
    # 1 год default - разумный compliance window для большинства regimes
    retention-days: ${AUDIT_RETENTION_DAYS:365}
    # 02:00 ежедневно - после ночных backup'ов, до orphan janitor (03:00)
    cron: ${AUDIT_RETENTION_CRON:0 0 2 * * *}

# LLM-конфиг (ADR-042 + ADR-058). Swappable provider: один LlmClient
# обслуживает AI editing (OCR text → ProseMirror JSON) и извлечение
# био-метаданных книг. По умолчанию provider=anthropic + key=disabled -
# AI-фичи отдают 503 / graceful fallback пока ключ не установлен:
#   export ANTHROPIC_API_KEY=sk-ant-api-...     (provider=anthropic)
#   export AI_PROVIDER=openai OPENAI_API_KEY=sk-...
#   export AI_PROVIDER=deepseek DEEPSEEK_API_KEY=sk-...
# Anthropic key - https://console.anthropic.com/settings/keys.
ai:
  # Swappable LLM provider (ADR-058). Выбирает активный LlmClient bean
  # через @ConditionalOnProperty(ai.provider): anthropic (default) /
  # openai / deepseek. Переключение = смена env AI_PROVIDER, без правки
  # кода. Ровно ОДИН клиент-бин активен (conditionals взаимоисключающие,
  # anthropic - matchIfMissing). Каждый провайдер читает свой блок ниже.
  provider: ${AI_PROVIDER:anthropic}
  # Опциональный исходящий HTTP-прокси ТОЛЬКО для LLM-вызовов (за корп-прокси,
  # где внешние хосты blackhole-DNS на 127.0.0.1). Формат http://user:pass@host:port.
  # Превентивный Proxy-Authorization (см. LlmHttpClients + gotchas "LLM за корп-прокси").
  # Пусто = прямое соединение. НЕ глобальный https.proxyHost (S3/MinIO не затрагивает).
  http:
    proxy: ${AI_HTTP_PROXY:}
  anthropic:
    # Sentinel "disabled" = LlmClient.isEnabled()=false → AI endpoint
    # вернёт 503, BookMetadataExtraction вернёт empty (graceful fallback).
    # Real key получить на https://console.anthropic.com/settings/keys
    api-key: ${ANTHROPIC_API_KEY:disabled}
    # Anthropic Messages API. Override для тестов / mock server.
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # Sonnet 4.6 - balance цена/качество для arabic structuring.
    # Haiku - дешевле но качество хуже на классическом arabic.
    # Opus - дороже на 5x, качество marginal лучше на тахкике.
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
    # Output JSON может быть длинным (~1000-2000 tokens per page),
    # 4096 даёт запас. Billing per output token.
    max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
    # 60s достаточно для cold start + сложной arabic page. Превышение
    # → IOException → Resilience4j retry либо fail.
    timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:60}
  # OpenAI Chat Completions API (активен при AI_PROVIDER=openai).
  # Тот же sentinel/timeout/max-tokens контракт что и anthropic.
  openai:
    api-key: ${OPENAI_API_KEY:disabled}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o}
    max-tokens: ${OPENAI_MAX_TOKENS:4096}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
  # DeepSeek (OpenAI-совместимый wire-формат, активен при
  # AI_PROVIDER=deepseek). Дешевле, отдельный endpoint/модель.
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:disabled}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  # AI editing pass (ADR-042). Liveness-escape для зависшего PROCESSING:
  # если worker умер mid-complete() до перехода в FAILED/DONE, строка
  # осталась бы навечно PROCESSING (re-AI-edit невозможен). Спустя этот
  # таймаут tryClaimAiEditProcessing вытесняет stale claim. Default 10
  # минут - комфортно выше LLM-таймаута (~60с + retries), живой worker
  # никогда не вытесняется.
  edit:
    processing-timeout-minutes: ${AI_EDIT_PROCESSING_TIMEOUT_MINUTES:10}

# Конфиг интеграции с shamela.ws через её desktop-API (ADR-020).
# Реверс-инжиниринг выполнен в параллельной сессии через mitmproxy на
# официальном desktop-клиенте shamela 4. Endpoints статические,
# api_key публичный (виден в любом дампе любого пользователя клиента) -
# но env-substitution оставлено для гибкости при необходимости смены.
shamela:
  api-key: ${SHAMELA_API_KEY:7b9524-8fc30c-e6241o-a0167e-a6d013}
  metadata-host: dev.shamela.ws
  metadata-scheme: https
  files-host: ready.shamela.ws
  # Каталог для временных zip + распакованных SQLite. После ETL
  # содержимое удаляется (опционально кешируется на диск для отладки).
  download-dir: ${java.io.tmpdir}/shamela
  # Таймаут запроса к API. Master-snapshot ~5MB качается за ~2с.
  # Отдельная книга ~100KB - <1с. Запас на медленный канал.
  request-timeout-seconds: 60
  # Таймаут установки соединения. Меньше request-timeout (быстро отказ
  # если сеть недоступна вообще, а не висим на полминуты).
  connect-timeout-seconds: 10

# Импорт книг из archive.org (ADR-056). Публичный metadata-API без авторизации.
# base-url вынесен в property чтобы IT-тесты могли указать на локальный
# HttpServer-stub (тот же приём что shamela.metadataScheme=http).
archiveorg:
  base-url: ${ARCHIVE_ORG_BASE_URL:https://archive.org}
  request-timeout-seconds: 30
  connect-timeout-seconds: 10

# План 2 alminasa (ADR-060): открытый ES-прокси, краулер → am_staging_*.
# origin отдельно от base-url: прокси проверяет Origin/Referer, в IT
# base-url подменяется stub'ом. Прокси-URL только для alminasa-клиента.
alminasa:
  enabled: ${ALMINASA_ENABLED:true}
  base-url: ${ALMINASA_BASE_URL:https://alminasa.ai}
  origin: https://alminasa.ai
  index-prefix: es-prod-euw1-
  index-suffix: -read
  http-proxy: ${ALMINASA_HTTP_PROXY:}
  connect-timeout-seconds: 10
  request-timeout-seconds: 60
  crawl:
    page-size: 100
    delay-ms: 1000
    dependent-batch-size: 25
    dependent-fetch-size: 500
    stale-timeout-minutes: 10

# Resilience4j Circuit Breaker (ADR-024, Этап 25.b - operational hardening).
# Защищает upstream HTTP вызовы от cascading failures.
#
# pdfDownload - PDF fetch с archive.org (часто 503/timeout под нагрузкой).
# При >50% ошибок за окно из 10 запросов -> circuit opens на 30 секунд.
# В open state все запросы fail fast с ShamelaApiException -> 503 наружу.
# Через 30 sec - HALF_OPEN: 3 пробных запроса, при успехе -> CLOSED.
resilience4j:
  circuitbreaker:
    instances:
      pdfDownload:
        # COUNT_BASED проще TIME_BASED для PDF: даже редкие запросы должны
        # учитываться. 10 запросов - reasonable окно для PDF (тяжёлые,
        # не часто пользователь читает).
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Какие exceptions считать failure. ShamelaApiException - наш
        # wrapper для HTTP 5xx/IO от archive.org.
        record-exceptions:
          - ru.basnukaev.argumentmap.library.shamela.api.ShamelaApiException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      # archiveOrg (ADR-056) - metadata API archive.org. Тот же профиль что
      # pdfDownload: при >50% ошибок за окно из 10 запросов circuit
      # открывается на 30с, далее fail-fast → 502. 404 (item не найден)
      # НЕ считается сбоем - исключён из record-exceptions (ArchiveOrgException
      # это технический сбой канала, ArchiveOrgItemNotFoundException - валидный 404).
      archiveOrg:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - ru.basnukaev.argumentmap.library.archiveorg.ArchiveOrgException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  # Retry для LLM API (ADR-042 + ADR-058, провайдер-агностично).
  # 3 попытки на transient failures (429 rate limit, 5xx server error,
  # IOException), exponential backoff между попытками. После исчерпания -
  # exception bubble up до caller (AiEditService → page FAILED;
  # BookMetadataExtractionService → empty fallback).
  retry:
    instances:
      llmApi:
        max-attempts: 3
        wait-duration: 2s
        # Exponential: 2s, 4s, 8s между попытками. 429 rate limit обычно
        # очищается за <5 секунд.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Какие ошибки считать transient (retry) против permanent (не
        # retry). retry-exception-predicate даёт per-statusCode контроль:
        # retry ТОЛЬКО на transient (IOException, 429 rate limit, 5xx, либо
        # statusCode=0 connection/timeout). Permanent 4xx (400 bad request,
        # 401 invalid key, 403, 404) НЕ повторяются - повтор только множит
        # cost+latency и оттягивает FAILED, шанса на успех нет.
        # Predicate приоритетнее retry-exceptions (последний бы матчил
        # любой LlmApiException включая 4xx).
        retry-exception-predicate: ru.basnukaev.argumentmap.ai.LlmTransientFailurePredicate
      # Retry для alminasa ES-прокси (План 2, ADR-060). 3 попытки на
      # transient failures (5xx, IOException, timeout), exponential backoff.
      # Predicate появляется в следующей задаче — резолвится в рантайме.
      alminasaApi:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: ru.basnukaev.argumentmap.hadith.alminasa.api.AlminasaTransientFailurePredicate

  # Metrics через actuator (см. management.endpoints.web ниже).
  metrics:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # health для load balancer, info для версии. circuitbreakers
        # для observability (curl /actuator/circuitbreakers выдаст state).
        include: health,info,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true

# Logging - вставляем MDC requestId и userId в default Spring Boot
# pattern через расширение pattern.level. RequestContextLogFilter
# ставит эти поля на каждый HTTP запрос (см. web/RequestContextLogFilter).
# %X{requestId:-} - пустая строка если MDC поле не выставлено (startup
# логи, фоновые задачи). Spring Boot сам подставит этот блок в дефолтный
# %5p pattern - не переписываем весь pattern (color codes specifc для
# console и file)
logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{userId:-}]"

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/argumentmap
    username: argmap
    password: argmap

# Vite dev на 5173, preview на 4173
app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:4173"

# В local-profile bucket bootstrap включён - MinIO docker-compose без
# ручного создания bucket'ов. В тестах остаётся off (default).
storage:
  bucket-bootstrap:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test

# Заглушка. Datasource конфигурируется через Testcontainers @ServiceConnection.

# Тестовый профиль использует фиксированные origin'ы для CorsIT
app:
  cors:
    allowed-origins: "http://localhost:5173"
